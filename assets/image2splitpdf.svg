<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2335" />
      <stop offset="100%" stop-color="#13141f" />
    </linearGradient>
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7768e" />
      <stop offset="100%" stop-color="#db4b4b" />
    </linearGradient>
    <clipPath id="tile1"><rect x="22" y="22" width="38" height="38" rx="7"/></clipPath>
    <clipPath id="tile2"><rect x="68" y="22" width="38" height="38" rx="7"/></clipPath>
    <clipPath id="tile3"><rect x="22" y="68" width="38" height="38" rx="7"/></clipPath>
    <clipPath id="tile4"><rect x="68" y="68" width="38" height="38" rx="7"/></clipPath>
  </defs>

  <!-- Background base rounded card -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#292e42" stroke-width="2"/>

  <!-- Shared Image Artwork Behind Clips (Landscape with Sun & Mountains) -->
  <!-- Tile 1: Top-Left -->
  <rect x="22" y="22" width="38" height="38" rx="7" fill="#24283b" stroke="#3b4261" stroke-width="2"/>
  <g clip-path="url(#tile1)">
    <circle cx="64" cy="48" r="18" fill="#e0af68" opacity="0.3"/>
    <path d="M14 62 L38 34 L62 62 Z" fill="#7aa2f7" opacity="0.75"/>
    <path d="M34 62 L52 44 L70 62 Z" fill="#9ece6a" opacity="0.8"/>
  </g>

  <!-- Tile 2: Top-Right -->
  <rect x="68" y="22" width="38" height="38" rx="7" fill="#24283b" stroke="#3b4261" stroke-width="2"/>
  <g clip-path="url(#tile2)">
    <circle cx="86" cy="38" r="10" fill="#e0af68"/>
    <path d="M50 62 L74 38 L98 62 Z" fill="#7aa2f7" opacity="0.75"/>
    <path d="M34 62 L52 44 L70 62 Z" fill="#9ece6a" opacity="0.8"/>
  </g>

  <!-- Tile 3: Bottom-Left -->
  <rect x="22" y="68" width="38" height="38" rx="7" fill="#24283b" stroke="#3b4261" stroke-width="2"/>
  <g clip-path="url(#tile3)">
    <path d="M14 80 L38 68 L62 90 Z" fill="#7aa2f7" opacity="0.4"/>
    <path d="M20 95 L45 80 L70 100 Z" fill="#9ece6a" opacity="0.5"/>
  </g>

  <!-- Tile 4: Bottom-Right -->
  <rect x="68" y="68" width="38" height="38" rx="7" fill="#24283b" stroke="#3b4261" stroke-width="2"/>
  <g clip-path="url(#tile4)">
    <path d="M50 82 L74 72 L98 92 Z" fill="#7aa2f7" opacity="0.4"/>
  </g>

  <!-- Split Grid Cutting Lines -->
  <line x1="64" y1="18" x2="64" y2="110" stroke="#7dcfff" stroke-width="2" stroke-dasharray="3 3" opacity="0.85"/>
  <line x1="18" y1="64" x2="110" y2="64" stroke="#7dcfff" stroke-width="2" stroke-dasharray="3 3" opacity="0.85"/>

  <!-- PDF Badge -->
  <rect x="62" y="86" width="48" height="24" rx="6" fill="url(#pdfGrad)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))"/>
  <text x="86" y="103" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="13" letter-spacing="1" text-anchor="middle">PDF</text>
</svg>
